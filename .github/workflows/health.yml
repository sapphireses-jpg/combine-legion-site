name: server health
on:
  schedule: [{ cron: "7,37 * * * *" }]
  workflow_dispatch:
permissions: {}
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: health 200
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 20 https://xolavzuxmzvpwwccnkxo.supabase.co/functions/v1/health; then exit 0; fi
            sleep 30
          done
          echo "::error::server health failed 3 times"
          exit 1
      - name: site app-ads.txt 200
        run: curl -fsS --max-time 20 https://sojaeha.studio/app-ads.txt
